<main class="connection-page">
  <section class="connection-card">
    <p class="eyebrow">Service management platform</p>

    <h1>{{ title }}</h1>

    <p class="description">
      Planning, employees, customers and work orders in one platform.
    </p>

    <div
      class="api-status"
      [class.connected]="isConnected()"
      [class.disconnected]="!isConnected()"
    >
      <span class="status-indicator"></span>
      {{ apiStatus() }}
    </div>
  </section>
</main>
